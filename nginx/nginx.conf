events {}

http {
    server {
        listen 80;

        # 1. Route main traffic to Django Hub
        location / {
            proxy_pass http://django:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 2. Protect the Streamlit app (Demo 1)
        location /demo1 {
            auth_request /verify_auth;
            
            # Use =302 to force the browser to physically redirect to the login page
            error_page 401 =302 /login/;

            proxy_pass http://demo1:8501;
            
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Host $host;
            
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # 3. Route to Demo 2
        location /demo2 {
            # Note: If you changed demo2 to port 8502 in docker-compose, update this to http://demo2:8502/;
            proxy_pass http://demo2:8501;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # 4. Internal auth check endpoint (hidden from users)
        location = /verify_auth {
            internal;
            proxy_pass http://django:8000/api/auth-check/;
            
            # Pass cookies to Django so it can verify the session
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            
            # REQUIRED: Pass the host so Django does not reject it with a 400 Bad Request
            proxy_set_header Host $host; 
        }
    }
}